<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeshMosh - Editor 3D</title>
  <link rel="stylesheet" href="style.css">
  <!-- Fuentes de Google -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Contenedor principal de Three.js -->
  <div id="scene-container"></div>

  <!-- MENÚ FLOTANTE (Abajo al centro) -->
  <nav class="floating-toolbar">
    <button class="tool-btn active" title="Seleccionar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg>
    </button>
    <button class="tool-btn" title="Mover">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 9l-3 3 3 3M9 5l3-3 3 3M9 19l3 3-3 3M19 9l3 3-3 3M2 12h20M12 2v20"/></svg>
    </button>
    <div class="divider"></div>
    <button class="tool-btn action-btn" title="Añadir Cubo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg>
    </button>
  </nav>

  <!-- BARRA LATERAL COLAPSABLE (Derecha) -->
  <aside class="sidebar collapsed" id="right-sidebar">
    <!-- Botón para abrir/cerrar -->
    <button class="toggle-btn" id="toggle-sidebar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    
    <div class="sidebar-content">
      <h2>MeshMosh</h2>
      
      <div class="section">
        <h3>👥 Usuarios Conectados</h3>
        <ul class="user-list">
          <li><span class="status online"></span> Tú (Admin)</li>
          <li><span class="status online"></span> Usuario 2</li>
        </ul>
      </div>

      <div class="section">
        <h3>🎛️ Propiedades</h3>
        <p class="empty-state">Selecciona un objeto</p>
      </div>
    </div>
  </aside>

  <script type="module" src="ui.js"></script>
</body>
</html>
